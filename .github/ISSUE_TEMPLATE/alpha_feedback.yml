name: Alpha developer experience feedback
description: Share friction from trying the alpha starter or a separate Mochi app.
title: "[Alpha DX]: "
labels: ["alpha", "developer-experience", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this after trying `apps/alpha-starter` or a separate app that consumes Mochi packages.
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow tested
      options:
        - "In-repo alpha starter"
        - "Separate app with packed tarballs"
        - "Playground demo"
        - "Docs only"
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Friction
      description: What felt confusing, repetitive, missing, or harder than expected?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would have felt better?
      description: Describe the smoother developer experience you wanted.
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands or code used
      render: shell
  - type: checkboxes
    id: outcome
    attributes:
      label: Outcome
      options:
        - label: I reached a playable scene.
        - label: I built for production.
        - label: I only used public `@mochi-labs/*` imports.
