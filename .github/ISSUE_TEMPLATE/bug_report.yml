name: Bug report
description: Report a reproducible Mochi engine, starter, or demo bug.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Mochi better. Clear reproduction steps are the fastest path to a fix.
  - type: input
    id: area
    attributes:
      label: Area
      description: Which package, demo, or workflow is affected?
      placeholder: "@mochi-labs/gameplay, GameCanvas, alpha starter, release workflow"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, input, scene setup, or a minimal code sample.
      placeholder: |
        1. Run `pnpm dev:starter`
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste terminal/browser logs or attach screenshots/recordings.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Node 20, pnpm 9.15.0, Chrome 124"
    validations:
      required: true
