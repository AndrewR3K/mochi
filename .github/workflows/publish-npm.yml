name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish without publishing packages.
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm verify

      - name: Resolve npm dist-tag
        id: release
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"

          if [[ "${VERSION}" == *"-alpha."* ]]; then
            TAG="alpha"
          elif [[ "${VERSION}" == *"-beta."* ]]; then
            TAG="beta"
          elif [[ "${VERSION}" == *"-rc."* ]]; then
            TAG="rc"
          elif [[ "${VERSION}" == *"-"* ]]; then
            echo "Unsupported prerelease version '${VERSION}'. Use alpha, beta, or rc."
            exit 1
          else
            TAG="latest"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Publishing version ${VERSION} with npm tag ${TAG}."

      - name: Publish packages
        shell: bash
        run: |
          publish_package() {
            local package_dir="$1"
            local dry_run_flag=""
            local provenance_flag="--provenance"
            local pack_dir="${RUNNER_TEMP}/mochi-packages"
            local package_file=""

            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              dry_run_flag="--dry-run"
              provenance_flag=""
            fi

            mkdir -p "${pack_dir}"
            package_file="$(pnpm --dir "${package_dir}" pack --json --pack-destination "${pack_dir}" | node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).filename));")"

            if [[ ! -f "${package_file}" ]]; then
              echo "Package tarball was not created for ${package_dir}."
              exit 1
            fi

            npm publish "${package_file}" \
              --access public \
              --tag "${{ steps.release.outputs.tag }}" \
              ${provenance_flag} \
              ${dry_run_flag}
          }

          publish_package packages/core
          publish_package packages/renderer-webgl
          publish_package packages/gameplay
          publish_package packages/vue
